<div class="container">

    <h1>Sistema de Vendas</h1>

    <label>Informe o valor do produto:</label>
    <input id="ValorProduto" type="text">

    <br><br>

    <label>Informe a condição de pagamento:</label>

    <select id="CondicaoPagamento">
        <option value="">Selecione uma opção</option>
        <option value="a">À vista em dinheiro ou cheque (10% desconto)</option>
        <option value="b">À vista no cartão (15% desconto)</option>
        <option value="c">2x sem juros</option>
        <option value="d">2x com juros de 10%</option>
    </select>

    <button onclick="CalcularVenda()">Calcular valor</button>

    <hr>

    <div id="ResultadoVenda"></div>

    <script src="/js/vendas.js"></script>

</div>
